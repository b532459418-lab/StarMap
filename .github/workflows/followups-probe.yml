name: Follow-ups probe (temporary)

# Temporary (test stability follow-ups, round 1; design artifacts/followups-20261107/design.md §1.3, §3, §5, §6). Runs
# on pushes to test/followups only, and is removed with its commit before the pull request. Each entry runs one
# experiment on its own runner, with the browser environment of ci.yml's browser checks (Node 24, the locked
# dependencies, Playwright's Chromium, the project's playwright.config.mjs with --use-angle=swiftshader), and uploads its
# records whatever the outcome.
on:
  push:
    branches: [test/followups]

permissions:
  contents: read

concurrency:
  group: followups-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # G1 (design §1.3): map-recovery.spec.mjs twice, with the teardown records (patch-teardown.mjs) and Playwright's
          # api and browser debug log; then the same without the trace, with a trace without screenshots, without disk caches.
          - name: g1-base
            args: tests/browser/map-recovery.spec.mjs --repeat-each=2
            params: '{}'
            debug: pw:api,pw:browser
            timeout: 25
          - name: g1-trace-off
            args: tests/browser/map-recovery.spec.mjs --repeat-each=2 --trace off
            params: '{}'
            debug: pw:api,pw:browser
            timeout: 25
          - name: g1-trace-noshots
            args: tests/browser/map-recovery.spec.mjs --repeat-each=2
            variants: g1-trace-noshots
            params: '{}'
            debug: pw:api,pw:browser
            timeout: 25
          - name: g1-no-cache
            args: tests/browser/map-recovery.spec.mjs --repeat-each=2
            variants: g1-no-cache
            params: '{}'
            debug: pw:api,pw:browser
            timeout: 25
          # G3 (design §3): the evidence screenshot case five times, a GPU process load (a worker's OffscreenCanvas WebGL
          # drawing) started as the screenshot starts, for 10 s; two strengths, with and without F5-1 (f5-off).
          - name: g3-k1-off
            args: tests/browser/time-filters.spec.mjs --grep "a cross-year visit belongs to both years" --repeat-each=5
            variants: g3-trigger f5-off
            params: '{"gpuLoad":{"ms":10000,"size":2048,"iterations":60}}'
            timeout: 25
          - name: g3-k1-on
            args: tests/browser/time-filters.spec.mjs --grep "a cross-year visit belongs to both years" --repeat-each=5
            variants: g3-trigger
            params: '{"gpuLoad":{"ms":10000,"size":2048,"iterations":60}}'
            timeout: 25
          - name: g3-k2-off
            args: tests/browser/time-filters.spec.mjs --grep "a cross-year visit belongs to both years" --repeat-each=5
            variants: g3-trigger f5-off
            params: '{"gpuLoad":{"ms":10000,"size":2048,"iterations":400}}'
            timeout: 25
          - name: g3-k2-on
            args: tests/browser/time-filters.spec.mjs --grep "a cross-year visit belongs to both years" --repeat-each=5
            variants: g3-trigger
            params: '{"gpuLoad":{"ms":10000,"size":2048,"iterations":400}}'
            timeout: 25
          # G5 (design §5): the refused-save case with its answers held 600 ms from the click (g5-hold), 20 times on each of
          # two runners; with a pause that does not turn the loop off, and with no pause on the save path, each must fail.
          - name: g5-a-x20
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=20
            variants: g5-hold
            params: '{}'
            timeout: 35
          - name: g5-b-x20
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=20
            variants: g5-hold
            params: '{}'
            timeout: 35
          - name: g5-mutation-loop
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=5
            variants: g5-hold mutation-loop
            params: '{}'
            timeout: 25
          - name: g5-mutation
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=5
            variants: g5-hold mutation
            params: '{}'
            timeout: 25
          # G6 (design §6.3): the globe throws while rendering, WebGL goes away, Reload map: before the fix it must fail
          # (a blank map), with the fix (g6-fix) it must show the no-WebGL notice.
          - name: g6-before
            args: tests/browser/g6-globe-reprobe.spec.mjs --repeat-each=3
            params: '{}'
            timeout: 20
          - name: g6-after
            args: tests/browser/g6-globe-reprobe.spec.mjs --repeat-each=3
            variants: g6-fix
            params: '{}'
            timeout: 20
    defaults:
      run:
        working-directory: 01_Web
    env:
      STARMAP_PROBE_OUT: ${{ github.workspace }}/probe-out
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01_Web/package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Add the probe's hooks and the G6 case (this checkout only)
        run: |
          node ../followups-probe/patch-helpers.mjs tests/browser/helpers.mjs
          node ../followups-probe/patch-teardown.mjs tests/browser/helpers.mjs
          cp ../followups-probe/g6-globe-reprobe.spec.mjs tests/browser/

      - name: Apply the variants (this checkout only)
        if: ${{ matrix.variants }}
        run: node ../followups-probe/patch-variant.mjs ${{ matrix.variants }}

      - name: Run the experiment
        env:
          STARMAP_PROBE_INIT: ${{ github.workspace }}/followups-probe/probe-init.js
          STARMAP_PROBE_PARAMS: ${{ matrix.params }}
          DEBUG: ${{ matrix.debug }}
        run: |
          mkdir -p "$STARMAP_PROBE_OUT"
          node ../followups-probe/run.mjs -- ${{ matrix.args }} > "$STARMAP_PROBE_OUT/run.log" 2>&1 || status=$?
          { grep -Ev '(^| )pw:(api|browser) ' "$STARMAP_PROBE_OUT/run.log" || true; } | tail -n 200
          exit "${status:-0}"

      - name: Keep the records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: followups-probe-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe-out/
            01_Web/test-results/browser/
            01_Web/playwright-report/browser/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
