name: Follow-ups probe (temporary)

# Temporary (test stability follow-ups, rounds 1 and 2; design artifacts/followups-20261107/design.md §10). Runs on
# pushes to test/followups only, and is removed with its commit before the pull request. Each entry runs one experiment
# on its own runner, with the browser environment of ci.yml's browser checks (Node 24, the locked dependencies,
# Playwright's Chromium, the project's playwright.config.mjs with --use-angle=swiftshader), and uploads its records
# whatever the outcome.
on:
  push:
    branches: [test/followups]

permissions:
  contents: read

concurrency:
  group: followups-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # G5 (design §10.2): the refused-save case as committed (answers held 600 ms, the map drawn before each save),
          # 20 times on each of two runners; with a pause that does not turn the loop off, and with no pause on the save path.
          - name: g5-a-x20
            runner: probe
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=20
            params: '{}'
            timeout: 40
          - name: g5-b-x20
            runner: probe
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=20
            params: '{}'
            timeout: 40
          - name: g5-mutation-loop
            runner: probe
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=5
            variants: mutation-loop
            params: '{}'
            timeout: 25
          - name: g5-mutation
            runner: probe
            args: tests/browser/critical-flows.spec.mjs --grep "a refused save, an unknown outcome" --repeat-each=5
            variants: mutation
            params: '{}'
            timeout: 25
          # G1 (design §10.1): map-recovery.spec.mjs twice as committed (no temporary screenshot of a passing case), with the
          # teardown records; then the same with the pages taken to about:blank before the context closes.
          - name: g1-base
            runner: probe
            args: tests/browser/map-recovery.spec.mjs --repeat-each=2
            params: '{}'
            debug: pw:api,pw:browser
            timeout: 25
          - name: g1-blank
            runner: probe
            args: tests/browser/map-recovery.spec.mjs --repeat-each=2
            variants: g1-blank
            params: '{}'
            debug: pw:api,pw:browser
            timeout: 25
          # G3 (design §10.3): the evidence screenshot case ten times with a 12 s GPU process load from the screenshot's start
          # (K1), without and with F5-1; the load's batches and the frame intervals are logged right after the capture.
          - name: g3-k1-off
            runner: probe
            args: tests/browser/time-filters.spec.mjs --grep "a cross-year visit belongs to both years" --repeat-each=10
            variants: g3-trigger f5-off
            params: '{"gpuLoad":{"ms":12000,"size":2048,"iterations":60}}'
            timeout: 30
          - name: g3-k1-on
            runner: probe
            args: tests/browser/time-filters.spec.mjs --grep "a cross-year visit belongs to both years" --repeat-each=10
            variants: g3-trigger
            params: '{"gpuLoad":{"ms":12000,"size":2048,"iterations":60}}'
            timeout: 30
          # G2 (design §10.5): every case of the critical group alone, one Playwright run per case (run-alone.mjs), dealt out
          # to four runners.
          - name: g2-alone-1of4
            runner: alone
            args: 1/4 tests/browser/critical-flows.spec.mjs tests/browser/map-recovery.spec.mjs
            params: '{}'
            timeout: 40
          - name: g2-alone-2of4
            runner: alone
            args: 2/4 tests/browser/critical-flows.spec.mjs tests/browser/map-recovery.spec.mjs
            params: '{}'
            timeout: 40
          - name: g2-alone-3of4
            runner: alone
            args: 3/4 tests/browser/critical-flows.spec.mjs tests/browser/map-recovery.spec.mjs
            params: '{}'
            timeout: 40
          - name: g2-alone-4of4
            runner: alone
            args: 4/4 tests/browser/critical-flows.spec.mjs tests/browser/map-recovery.spec.mjs
            params: '{}'
            timeout: 40
          # The critical group whole, as ci.yml runs it (npm run test:browser -- --critical-flows), without the probe's
          # hooks: its duration with G1 and G2.
          - name: critical-whole
            runner: group
            params: '{}'
            timeout: 45
    defaults:
      run:
        working-directory: 01_Web
    env:
      STARMAP_PROBE_OUT: ${{ github.workspace }}/probe-out
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01_Web/package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Add the probe's hooks (this checkout only)
        if: ${{ matrix.runner != 'group' }}
        run: |
          node ../followups-probe/patch-helpers.mjs tests/browser/helpers.mjs
          node ../followups-probe/patch-teardown.mjs tests/browser/helpers.mjs

      - name: Apply the variants (this checkout only)
        if: ${{ matrix.variants }}
        run: node ../followups-probe/patch-variant.mjs ${{ matrix.variants }}

      - name: Run the experiment
        env:
          STARMAP_PROBE_INIT: ${{ matrix.runner != 'group' && format('{0}/followups-probe/probe-init.js', github.workspace) || '' }}
          STARMAP_PROBE_PARAMS: ${{ matrix.params }}
          DEBUG: ${{ matrix.debug }}
        run: |
          mkdir -p "$STARMAP_PROBE_OUT"
          case "${{ matrix.runner }}" in
            probe) node ../followups-probe/run.mjs -- ${{ matrix.args }} > "$STARMAP_PROBE_OUT/run.log" 2>&1 || status=$? ;;
            alone) node ../followups-probe/run-alone.mjs ${{ matrix.args }} > "$STARMAP_PROBE_OUT/run.log" 2>&1 || status=$? ;;
            group) npm run test:browser -- --critical-flows > "$STARMAP_PROBE_OUT/run.log" 2>&1 || status=$? ;;
          esac
          { grep -Ev '(^| )pw:(api|browser) ' "$STARMAP_PROBE_OUT/run.log" || true; } | tail -n 200
          exit "${status:-0}"

      - name: Keep the records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: followups-probe-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe-out/
            01_Web/test-results/browser/
            01_Web/playwright-report/browser/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
