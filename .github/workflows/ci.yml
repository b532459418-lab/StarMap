name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    name: Public checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 01_Web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01_Web/package-lock.json

      # release:check installs locked dependencies inside a clean Git archive.
      - name: Check privacy, lint, tests, and public build
        run: npm run release:check

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check critical browser flows with isolated synthetic data
        run: npm run test:browser
