name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 01_Web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01_Web/package-lock.json

      # Keep the clean Git archive privacy/lint/unit/build verification.
      - name: Check privacy, lint, tests, and public build
        run: npm run release:check

  browser-checks:
    name: Browser checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - suite: critical
            flag: --critical-flows
          - suite: media
            flag: --media-recovery
          - suite: time
            flag: --time-filters
    defaults:
      run:
        working-directory: 01_Web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01_Web/package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Independent runners keep one worker, port 5173 and private fixture per group.
      - name: Check browser group with isolated synthetic data
        run: npm run test:browser -- ${{ matrix.flag }}

      - name: Preserve failed synthetic browser evidence
        if: failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-failure-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            01_Web/test-results/browser/
            01_Web/playwright-report/browser/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  public-checks:
    name: Public checks
    needs: [source-checks, browser-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source and browser check to succeed
        env:
          SOURCE_RESULT: ${{ needs['source-checks'].result }}
          BROWSER_RESULT: ${{ needs['browser-checks'].result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$BROWSER_RESULT" = success
