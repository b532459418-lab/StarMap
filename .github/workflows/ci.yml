name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    name: Public checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 01_Web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01_Web/package-lock.json

      # release:check installs locked dependencies inside a clean Git archive.
      - name: Check privacy, lint, tests, and public build
        run: npm run release:check

      - name: Install locked browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check critical browser flows with isolated synthetic data
        run: npm run test:browser

      # Only the isolated browser runner writes these paths; no private-root data.
      - name: Preserve failed synthetic browser evidence
        if: failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            01_Web/test-results/browser/
            01_Web/playwright-report/browser/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
